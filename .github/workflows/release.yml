name: Release DMS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Embed release version in updater
        shell: pwsh
        run: |
          $path = ".\App.xaml.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'private const string CurrentVersion = "[^"]+";', 'private const string CurrentVersion = "${{ steps.version.outputs.version }}";'
          Set-Content $path $content

      - name: Embed release database configuration
        shell: pwsh
        env:
          DMS_MONGO_CONNECTION_STRING: ${{ secrets.DMS_MONGO_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DMS_MONGO_CONNECTION_STRING)) {
            throw "The DMS_MONGO_CONNECTION_STRING GitHub secret is not configured."
          }
          $path = ".\Data\MongoConfig.cs"
          $content = Get-Content $path -Raw
          $connectionStringLiteral = $env:DMS_MONGO_CONNECTION_STRING | ConvertTo-Json -Compress
          $content = $content.Replace('"__DMS_RELEASE_CONNECTION_STRING__"', $connectionStringLiteral)
          Set-Content $path $content

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish .\DMS.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o .\publish\DMS-${{ steps.version.outputs.version }}

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\DMS-${{ steps.version.outputs.version }}\* `
            -DestinationPath .\publish\DMS-${{ steps.version.outputs.version }}.zip `
            -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DMS ${{ github.ref_name }}
          generate_release_notes: true
          files: .\publish\DMS-${{ steps.version.outputs.version }}.zip
