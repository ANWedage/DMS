name: Release DMS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Embed release version in updater
        shell: pwsh
        run: |
          $path = ".\App.xaml.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace 'private const string CurrentVersion = "[^"]+";', 'private const string CurrentVersion = "${{ steps.version.outputs.version }}";'
          Set-Content $path $content

      - name: Publish self-contained Windows application
        shell: pwsh
        run: |
          dotnet publish .\DMS.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:Version=${{ steps.version.outputs.version }} `
            -o .\publish\DMS-${{ steps.version.outputs.version }}

      - name: Configure API endpoint
        shell: pwsh
        env:
          DMS_API_BASE_URL: ${{ secrets.DMS_API_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DMS_API_BASE_URL)) {
            throw "The DMS_API_BASE_URL GitHub secret is not configured."
          }
          $releaseDirectory = ".\publish\DMS-${{ steps.version.outputs.version }}"
          Set-Content -Path "$releaseDirectory\.env" -Value "DMS_API_BASE_URL=$($env:DMS_API_BASE_URL)"

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\DMS-${{ steps.version.outputs.version }}\DMS.exe, .\publish\DMS-${{ steps.version.outputs.version }}\.env `
            -DestinationPath .\publish\DMS-${{ steps.version.outputs.version }}.zip `
            -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DPublishDirectory="$(Resolve-Path .\publish\DMS-${{ steps.version.outputs.version }})" `
            .\installer\DMS.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DMS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            .\publish\DMS-${{ steps.version.outputs.version }}.zip
            .\publish\DMS-Setup-${{ steps.version.outputs.version }}.exe
